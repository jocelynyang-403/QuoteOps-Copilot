[project]
name = "quoteops-copilot"
version = "0.1.0"
description = "Deterministic quote preparation with a human approval gate."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quoteops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
